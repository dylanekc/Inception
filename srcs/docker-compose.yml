# routeur virtuel prive
networks:
  inception:
    driver: bridge

# disque dur
volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dylekici/data/mariadb

  wp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dylekici/data/wordpress

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file: .env
    networks:
      - inception
    restart: always # securite
    volumes:
      - db-data:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file: .env
    networks:
      - inception
    restart: always
    depends_on:
      - mariadb
    volumes:
      - wp-data:/var/www/html

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    env_file: .env
    networks:
      - inception
    restart: always
    depends_on:
      - wordpress
    ports:
      - "4443:443"
    volumes:
      - wp-data:/var/www/html
